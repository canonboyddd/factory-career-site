<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工場・製造業の求人条件スコア比較｜無料ツール</title><meta name="description" content="年収、夜勤、残業、休日、通勤、仕事内容を5段階で採点し、工場・製造業求人を同じ基準で比較する無料ツールです。"><link rel="canonical" href="https://factory-career-site.pages.dev/tools/job-offer-score"><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../assets/tools.css"></head><body><div class="ad-note">当サイトはアフィリエイト広告を利用しています。</div><header class="site-header"><div class="container header-inner"><a class="logo" href="/"><span class="logo-mark">工</span><span>工場キャリア診断</span></a><button class="menu-btn" aria-label="メニュー">☰</button><nav><a href="/diagnosis">転職検討度診断</a><a href="../articles/">記事一覧</a></nav></div></header><main><div class="tool-shell"><div class="breadcrumbs"><a href="/">トップ</a> › <a href="/tools/">無料ツール</a> › 求人条件スコア</div><span class="eyebrow">JOB OFFER TOOL</span><h1 style="font-size:clamp(32px,6vw,50px)">求人条件スコア比較</h1><p>求人票を見て「なんとなく良さそう」で決めないために、今の職場または候補求人を同じ6項目で採点します。1=かなり不満、5=かなり良いで入力してください。</p><div class="tool-card"><div class="tool-grid" id="fields"></div><div class="tool-actions"><button class="btn btn-primary" id="calc">スコアを見る</button><button class="btn btn-secondary" id="reset">リセット</button></div><div class="tool-result" id="result"><h2>条件スコア</h2><div class="tool-kpis"><div class="tool-kpi"><span>合計</span><strong id="total">-</strong></div><div class="tool-kpi"><span>100点換算</span><strong id="pct">-</strong></div><div class="tool-kpi"><span>弱い条件</span><strong id="weak">-</strong></div></div><p id="comment"></p><div class="score-bar"><span id="bar"></span></div><p class="tool-note">採点基準はあなた自身の優先順位で構いません。企業評価や採用可能性を判定するツールではありません。</p><div class="cta-row"><a class="btn btn-primary" href="/articles/factory-job-offer-check">求人票の見方を読む</a><a class="btn btn-secondary" href="/diagnosis">7問で転職検討度を整理</a></div></div></div></div></main><footer class="footer"><div class="container"><small>© <span data-year></span> 工場キャリア診断.</small></div></footer><script src="../assets/config.js"></script><script src="../assets/main.js"></script><script>(()=>{const items=[['income','年収・基本給'],['night','夜勤・勤務時間'],['overtime','残業・休日出勤'],['holiday','休日・休暇'],['commute','通勤・勤務地'],['work','仕事内容・成長']];const f=document.getElementById('fields');items.forEach(([id,label])=>{f.insertAdjacentHTML('beforeend',`<div class="field"><label>${label}</label><select id="${id}"><option value="">選択</option><option value="1">1 かなり不満</option><option value="2">2 不満</option><option value="3">3 普通</option><option value="4">4 良い</option><option value="5">5 かなり良い</option></select></div>`)});document.getElementById('calc').onclick=()=>{const vals=items.map(([id,label])=>({id,label,v:Number(document.getElementById(id).value||0)}));if(vals.some(x=>!x.v)){alert('6項目すべて選択してください');return;}const total=vals.reduce((s,x)=>s+x.v,0),pct=Math.round(total/30*100),weak=vals.slice().sort((a,b)=>a.v-b.v)[0];document.getElementById('total').textContent=total+'/30';document.getElementById('pct').textContent=pct+'点';document.getElementById('weak').textContent=weak.label;document.getElementById('bar').style.width=pct+'%';document.getElementById('comment').textContent=`最も点が低いのは「${weak.label}」です。候補求人を比較するときは、この項目が今より改善するかを先に確認すると判断しやすくなります。`;document.getElementById('result').classList.add('active');window.trackSiteEvent?.('job_offer_tool_complete',{score:pct,weak:weak.id});};document.getElementById('reset').onclick=()=>{items.forEach(([id])=>document.getElementById(id).value='');document.getElementById('result').classList.remove('active');};})();</script></body></html>
