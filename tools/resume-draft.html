<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>製造業の職務経歴書たたき台作成ツール｜無料・登録不要</title><meta name="description" content="担当工程、設備、品質、改善、教育経験を入力して、製造業・工場勤務向けの職務経歴書のたたき台をブラウザ内で作成する無料ツールです。"><link rel="canonical" href="https://factory-career-site.pages.dev/tools/resume-draft"><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../assets/tools.css"><style>.draft-output{white-space:pre-wrap;background:#fff;border:1px solid #dfe5ec;border-radius:14px;padding:18px;min-height:180px}.wide{grid-column:1/-1}.field textarea{width:100%;min-height:90px;border:1px solid #cbd5e1;border-radius:12px;padding:13px 14px;font:inherit;resize:vertical}</style></head><body><div class="ad-note">当サイトはアフィリエイト広告を利用しています。</div><header class="site-header"><div class="container header-inner"><a class="logo" href="/"><span class="logo-mark">工</span><span>工場キャリア診断</span></a><button class="menu-btn" aria-label="メニュー">☰</button><nav><a href="/diagnosis">転職検討度診断</a><a href="../articles/">記事一覧</a><a href="/tools/">無料ツール</a></nav></div></header><main><div class="tool-shell"><div class="breadcrumbs"><a href="/">トップ</a> › <a href="/tools/">無料ツール</a> › 職務経歴書たたき台</div><span class="eyebrow">RESUME TOOL</span><h1 style="font-size:clamp(32px,6vw,50px)">製造業の職務経歴書たたき台作成</h1><p>個人名・会社名を入力せず、担当工程や経験だけから職務要約のたたき台を作ります。入力内容はこのページ内で処理します。</p><div class="tool-card"><div class="tool-grid"><div class="field"><label>主な職種</label><select id="job"><option value="製造・組立">製造・組立</option><option value="機械オペレーター">機械オペレーター</option><option value="品質管理・品質保証">品質管理・品質保証</option><option value="生産技術">生産技術</option><option value="設備保全">設備保全</option><option value="生産管理">生産管理</option><option value="機械設計">機械設計</option><option value="電気・制御設計">電気・制御設計</option></select></div><div class="field"><label>経験年数（おおよそ）</label><input id="years" type="number" min="0" max="50" placeholder="例 5"></div><div class="field wide"><label>担当した製品・工程</label><textarea id="process" placeholder="例：自動車部品の組立工程、加工ライン、最終検査工程"></textarea></div><div class="field wide"><label>設備・工具・ソフト</label><textarea id="tools" placeholder="例：自動組立機、トルクレンチ、PLC、三次元測定機、CAD"></textarea></div><div class="field wide"><label>品質・安全・改善で担当したこと</label><textarea id="quality" placeholder="例：不良の一次対応、5S、作業手順の見直し、日常点検"></textarea></div><div class="field wide"><label>教育・リーダー・調整経験</label><textarea id="role" placeholder="例：新人2名の教育、班内の進捗確認、他部署との調整"></textarea></div></div><div class="tool-actions"><button class="btn btn-primary" id="make">たたき台を作る</button><button class="btn btn-secondary" id="clear">リセット</button></div><div class="tool-result" id="result"><h2>職務要約のたたき台</h2><div class="draft-output" id="output"></div><div class="tool-actions"><button class="btn btn-primary" id="copy">文章をコピー</button><a class="btn btn-secondary" href="/articles/factory-resume">書き方のポイントを読む</a></div><p class="tool-note">そのまま提出せず、実際に担当した事実だけが残るように修正してください。実績・数値・資格などを推測して追加しないでください。</p></div></div></div></main><footer class="footer"><div class="container"><small>© <span data-year></span> 工場キャリア診断.</small></div></footer><script src="../assets/config.js"></script><script src="../assets/main.js"></script><script>(()=>{const val=id=>document.getElementById(id).value.trim();const clean=s=>s.replace(/\s+/g,' ').trim();document.getElementById('make').onclick=()=>{const job=val('job'),years=val('years'),process=clean(val('process')),tools=clean(val('tools')),quality=clean(val('quality')),role=clean(val('role'));const parts=[];parts.push(`${job}として${years?years+'年程度の':''}実務経験があります。`);if(process)parts.push(`主に${process}を担当しました。`);if(tools)parts.push(`業務では${tools}を使用・経験しています。`);if(quality)parts.push(`また、${quality}にも携わりました。`);if(role)parts.push(`加えて、${role}の経験があります。`);parts.push('これまでの現場経験を活かしながら、次の職場でも安全・品質・安定した業務遂行に貢献したいと考えています。');document.getElementById('output').textContent=parts.join('');document.getElementById('result').classList.add('active');window.trackSiteEvent?.('resume_tool_complete',{job});};document.getElementById('copy').onclick=async()=>{const t=document.getElementById('output').textContent;if(!t)return;try{await navigator.clipboard.writeText(t);document.getElementById('copy').textContent='コピーしました';setTimeout(()=>document.getElementById('copy').textContent='文章をコピー',1600);}catch(_){alert('コピーできない場合は文章を長押しして選択してください。');}};document.getElementById('clear').onclick=()=>{['years','process','tools','quality','role'].forEach(id=>document.getElementById(id).value='');document.getElementById('result').classList.remove('active');};})();</script></body></html>
