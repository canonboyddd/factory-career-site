<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工場勤務の年収・手当依存度チェック｜無料計算</title><meta name="description" content="基本給・賞与・夜勤手当・残業代・その他手当を入力して、年収の内訳と手当依存度を無料で確認できます。"><link rel="canonical" href="https://factory-career-site.pages.dev/tools/salary-compare.html"><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../assets/tools.css"></head><body><div class="ad-note">当サイトはアフィリエイト広告を利用しています。</div><header class="site-header"><div class="container header-inner"><a class="logo" href="../index.html"><span class="logo-mark">工</span><span>工場キャリア診断</span></a><button class="menu-btn" aria-label="メニュー">☰</button><nav><a href="../diagnosis.html">転職検討度診断</a><a href="../articles/">記事一覧</a></nav></div></header><main><div class="tool-shell"><div class="breadcrumbs"><a href="../index.html">トップ</a> › <a href="index.html">無料ツール</a> › 年収・手当依存度</div><span class="eyebrow">SALARY TOOL</span><h1 style="font-size:clamp(32px,6vw,50px)">年収・手当依存度チェック</h1><p>「年収は高いのに、夜勤や残業を減らすと大きく下がるかも」という状態を確認するための簡易計算です。金額はすべて額面の概算で入力してください。</p><div class="tool-card"><div class="tool-grid"><div class="field"><label>月の基本給（円）</label><input id="base" inputmode="numeric" type="number" min="0" placeholder="例 250000"></div><div class="field"><label>年間賞与（円）</label><input id="bonus" inputmode="numeric" type="number" min="0" placeholder="例 800000"></div><div class="field"><label>月の夜勤・交替手当（円）</label><input id="night" inputmode="numeric" type="number" min="0" placeholder="例 40000"></div><div class="field"><label>月の残業代（円）</label><input id="ot" inputmode="numeric" type="number" min="0" placeholder="例 35000"></div><div class="field"><label>月のその他固定手当（円）</label><input id="other" inputmode="numeric" type="number" min="0" placeholder="例 15000"></div></div><div class="tool-actions"><button class="btn btn-primary" id="calc">計算する</button><button class="btn btn-secondary" id="reset">リセット</button></div><div class="tool-result" id="result"><h2>計算結果</h2><div class="tool-kpis"><div class="tool-kpi"><span>概算年収</span><strong id="annual">-</strong></div><div class="tool-kpi"><span>夜勤+残業の年間額</span><strong id="variable">-</strong></div><div class="tool-kpi"><span>夜勤+残業依存度</span><strong id="ratio">-</strong></div></div><p id="comment"></p><div class="score-bar"><span id="bar"></span></div><p class="tool-note">この計算は税金・社会保険・会社固有の賞与算定などを考慮しない簡易計算です。実際の求人比較では雇用条件通知書等を確認してください。</p><div class="cta-row"><a class="btn btn-primary" href="../articles/manufacturing-500-income.html">年収アップの求人比較を読む</a><a class="btn btn-secondary" href="../diagnosis.html">7問で条件整理</a></div></div></div></div></main><footer class="footer"><div class="container"><small>© <span data-year></span> 工場キャリア診断.</small></div></footer><script src="../assets/config.js"></script><script src="../assets/main.js"></script><script>(()=>{const n=id=>Math.max(0,Number(document.getElementById(id).value||0)),yen=v=>Math.round(v).toLocaleString('ja-JP')+'円';document.getElementById('calc').onclick=()=>{const base=n('base'),bonus=n('bonus'),night=n('night'),ot=n('ot'),other=n('other');const annual=base*12+bonus+(night+ot+other)*12;const variable=(night+ot)*12;const ratio=annual?Math.round(variable/annual*100):0;document.getElementById('annual').textContent=yen(annual);document.getElementById('variable').textContent=yen(variable);document.getElementById('ratio').textContent=ratio+'%';document.getElementById('bar').style.width=Math.min(100,ratio)+'%';document.getElementById('comment').textContent=ratio>=20?'夜勤・残業が年収に占める割合が大きめです。日勤・残業少なめの求人では「想定年収」だけでなく基本給と賞与を比較してください。':ratio>=10?'夜勤・残業分も年収に影響しています。転職先の基本給・賞与・手当を分けて比較すると差が分かりやすくなります。':'夜勤・残業への依存は相対的に小さめです。基本給・賞与・休日などを中心に求人を比較してください。';document.getElementById('result').classList.add('active');window.trackSiteEvent?.('salary_tool_complete',{dependency_ratio:ratio});};document.getElementById('reset').onclick=()=>{['base','bonus','night','ot','other'].forEach(id=>document.getElementById(id).value='');document.getElementById('result').classList.remove('active');};})();</script></body></html>
