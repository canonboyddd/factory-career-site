name: Public runner diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner started
        run: |
          echo "public-runner-started"
          uname -a
