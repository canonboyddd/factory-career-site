name: Analytics Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analytics-production-smoke.yml'
      - 'assets/analytics.js'
      - 'assets/central-tracker.js'
      - 'assets/diagnosis.js'
      - 'assets/offers.js'
      - 'assets/service-review.js'
      - 'assets/rakuten-products.js'
      - 'functions/api/analytics/collect.js'
      - 'qa/affiliate-revenue.spec.cjs'
      - 'qa/affiliate-production.cjs'
      - 'qa/dashboard-revenue-state.cjs'
      - 'assets/ops-dashboard.js'
      - 'assets/ops-intelligence.js'
      - 'functions/api/admin/ops-intelligence.js'
      - 'functions/api/admin/ops-revenue.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for existing Pages deployment
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsSL 'https://factory-career-site.pages.dev/assets/analytics.js' -o /tmp/factory-analytics.js && grep -q 'diagnosis_result_view' /tmp/factory-analytics.js; then exit 0; fi
            sleep 10
          done
          echo 'Updated analytics asset did not reach production in five minutes.'
          exit 1

      - name: Verify production analytics assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://factory-career-site.pages.dev'
          curl -fsSL "$BASE/" -o /tmp/factory-home.html
          curl -fsSL "$BASE/assets/main.js" -o /tmp/factory-main.js
          curl -fsSL "$BASE/assets/analytics.js" -o /tmp/factory-analytics.js
          grep -q 'assets/main.js' /tmp/factory-home.html
          grep -q 'assets/analytics.js' /tmp/factory-main.js
          grep -q "collect('page_view'" /tmp/factory-analytics.js
          echo 'Production analytics assets are present.'

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run offline revenue funnel regression
        run: node qa/affiliate-revenue.spec.cjs

      - name: Verify unavailable revenue and factory deduplication
        run: node qa/dashboard-revenue-state.cjs

      - name: Verify automated production visits are excluded
        shell: bash
        run: |
          cat > /tmp/analytics-smoke.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            let observed = 0;
            await page.route('**/api/analytics/collect', async route => {
              const req = route.request();
              try {
                const body = req.postDataJSON();
                if (body) observed++;
              } catch (_) {}
              await route.abort();
            });
            await page.route('**/api/central/collect', route => route.abort());
            await page.route(/https:\/\/(?!factory-career-site\.pages\.dev)/, route => route.abort());
            await page.goto('https://factory-career-site.pages.dev/?qa=1', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(3000);
            if (observed !== 0) throw new Error('Automated QA must not emit production page_view or click events');
            console.log('QA emitted no analytics requests.');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node /tmp/analytics-smoke.cjs

      - name: Verify test requests are excluded without D1 writes
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -X POST 'https://factory-career-site.pages.dev/api/analytics/collect' -H 'content-type: application/json' -H 'x-analytics-test: 1' --data '{}')
          echo "$RESPONSE" | grep -q '"excluded":true'
          echo 'Production collector excluded QA before database writes.'

      - name: Verify deployed revenue paths and responsive screens
        run: node qa/affiliate-production.cjs

      - name: Preserve revenue QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-revenue-qa
          path: reports/affiliate-revenue-qa/
