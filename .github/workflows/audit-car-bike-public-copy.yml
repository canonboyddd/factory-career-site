name: Audit car-bike public copy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-car-bike-public-copy.mjs'
      - 'scripts/audit-car-bike-rendered-copy.mjs'
      - '.github/workflows/audit-car-bike-public-copy.yml'
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: read

jobs:
  audit-public-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit every sitemap URL for operator-only copy
        run: node scripts/audit-car-bike-public-copy.mjs
      - name: Install Chromium for rendered copy audit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit rendered DOM on every sitemap URL
        run: node scripts/audit-car-bike-rendered-copy.mjs
