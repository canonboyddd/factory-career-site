name: Full Site Integrity

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - 'functions/**'
      - 'qa/full-site-integrity.cjs'
      - 'sitemap*.xml'
      - '.github/workflows/full-site-integrity.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full-site integrity audit
        run: node qa/full-site-integrity.cjs
