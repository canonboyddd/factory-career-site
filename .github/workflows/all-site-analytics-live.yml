name: All-site analytics live QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/all-site-analytics-live.yml'
      - 'qa/all-site-analytics-live.spec.cjs'
      - 'assets/main.js'
      - 'assets/analytics.js'
      - 'functions/api/central/verify-sites.js'
  workflow_dispatch:

# Cancel superseded QA on rapid main pushes; keep the latest run only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      # Keep ordinary pushes low-impact: run measurement, dedupe and receipt checks only.
      # The full ~16k-URL live SEO crawl is retained for explicit manual dispatch.
      - name: Run lightweight all-site analytics QA
        if: github.event_name == 'push'
        run: npx playwright test qa/all-site-analytics-live.spec.cjs --reporter=line --grep-invert 'all five production sites keep public search pages indexable'
      - name: Run full all-site production and indexing audit
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test qa/all-site-analytics-live.spec.cjs --reporter=line

