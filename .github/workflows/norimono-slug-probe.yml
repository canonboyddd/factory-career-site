name: Norimono slug probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/norimono-slug-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find live Cub URLs
        shell: bash
        run: |
          node <<'NODE'
          const base='https://norimono-cost.com';
          const index=await (await fetch(base+'/sitemap-index.xml')).text();
          const maps=[...index.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          console.log('sitemaps',maps.length);
          const hits=[];
          for(const url of maps){
            try{
              const text=await (await fetch(url)).text();
              for(const m of text.matchAll(/<loc>([^<]*(?:cub|カブ)[^<]*)<\/loc>/gi)) hits.push(m[1]);
            }catch(e){console.log('ERR',url,String(e))}
          }
          console.log('CUB_URLS',JSON.stringify([...new Set(hits)],null,2));
          NODE
