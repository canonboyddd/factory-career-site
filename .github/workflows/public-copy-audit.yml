name: Public Copy Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-copy-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-public-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Crawl all sitemap pages for operator-facing visible text
        shell: bash
        run: |
          cat > /tmp/public-copy-audit.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');

          const forbidden = [
            /運営者/g,/管理者/g,/運営用/g,/管理用/g,/SEO/g,/検索意図/g,/インデックス/g,
            /canonical/gi,/構造化データ/g,/Search Console/gi,/IndexNow/gi,/サイトマップ送信/g,
            /計測/g,/PV/g,/セッション/g,/CVR/gi,/CTR/gi,/コンバージョン/g,/CTA/g,
            /アフィリエイト運用/g,/収益化/g,/収益確認/g,/案件クリック/g,/デバッグ/g,/テスト用/g,
            /管理画面/g,/内部用/g,/運用メモ/g,/運営メモ/g,/管理メモ/g,/サイト改善用/g
          ];

          async function getUrls() {
            const xml = await (await fetch('https://factory-career-site.pages.dev/sitemap.xml')).text();
            const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1].trim());
            return [...new Set(urls)].filter(u => u.startsWith('https://factory-career-site.pages.dev/'));
          }

          (async () => {
            const urls = await getUrls();
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext();
            const hits = [];
            const errors = [];
            for (const url of urls) {
              const page = await context.newPage();
              await page.route('**/api/analytics/collect', route => route.abort());
              try {
                const res = await page.goto(url, {waitUntil:'domcontentloaded', timeout:25000});
                if (!res || res.status() >= 400) errors.push({url,status:res?.status() || 0});
                await page.waitForTimeout(300);
                const text = await page.locator('body').innerText().catch(()=> '');
                const lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
                for (const line of lines) {
                  for (const rx of forbidden) {
                    rx.lastIndex = 0;
                    if (rx.test(line)) {
                      hits.push({url,line});
                      break;
                    }
                  }
                }
              } catch (e) {
                errors.push({url,error:String(e.message||e).slice(0,180)});
              } finally {
                await page.close();
              }
            }
            await browser.close();
            console.log(`AUDITED_URLS=${urls.length}`);
            console.log('OPERATOR_COPY_HITS_START');
            for (const h of hits) console.log(`${h.url}\t${h.line}`);
            console.log('OPERATOR_COPY_HITS_END');
            console.log('CRAWL_ERRORS_START');
            for (const e of errors) console.log(JSON.stringify(e));
            console.log('CRAWL_ERRORS_END');
            if (errors.length) process.exitCode = 2;
            if (hits.length) process.exitCode = 3;
          })();
          NODE
          node /tmp/public-copy-audit.cjs
