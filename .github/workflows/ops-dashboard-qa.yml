name: Ops Dashboard QA

on:
  push:
    branches: [main]
    paths:
      - 'functions/api/admin/central-dashboard.js'
      - 'functions/api/admin/ops-intelligence.js'
      - 'functions/api/admin/okazu-analytics.js'
      - 'functions/api/admin/seo-data.js'
      - 'functions/api/central/collect.js'
      - 'assets/admin-seo-data.js'
      - 'ops-dashboard.html'
      - 'qa/ops-dashboard-contract.spec.cjs'
      - '.github/workflows/ops-dashboard-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check dashboard analytics syntax
        run: |
          node --check functions/api/admin/central-dashboard.js
          node --check functions/api/admin/ops-intelligence.js
          node --check functions/api/admin/okazu-analytics.js
          node --check functions/api/admin/seo-data.js
          node --check functions/api/central/collect.js
          node --check assets/admin-seo-data.js
      - name: Check dashboard contracts
        run: node qa/ops-dashboard-contract.spec.cjs
