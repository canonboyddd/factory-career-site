name: Normalize Public Review Labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-public-review-labels.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace internal CTA labels
        run: |
          # One-time source cleanup for the two public service review pages.
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('articles/makers-job-review.html'),
              Path('articles/samurai-job-review.html'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              updated = text.replace('PR｜中間CTA', 'PR')
              if updated == text:
                  raise SystemExit(f'Expected label not found in {p}')
              p.write_text(updated, encoding='utf-8')
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/makers-job-review.html articles/samurai-job-review.html
          git commit -m "Remove internal CTA labels from public reviews"
          git push origin HEAD:main
