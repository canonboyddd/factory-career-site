name: Fix factory analytics loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-factory-analytics-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch shared main loader
        run: python -c 'from pathlib import Path; p=Path("assets/main.js"); s=p.read_text(); old="  ensureConfig(initAnalytics);"; new="  function initD1Analytics(){\n    if(window.__factoryD1AnalyticsLoader||document.querySelector(\"[data-factory-d1-analytics]\"))return;\n    window.__factoryD1AnalyticsLoader=true;\n    const s=document.createElement(\"script\");\n    s.src=root+\"assets/analytics.js?v=20261003-1\";\n    s.dataset.factoryD1Analytics=\"\";\n    s.async=false;\n    document.head.appendChild(s);\n  }\n  ensureConfig(()=>{initAnalytics();initD1Analytics();});"; assert old in s or "initD1Analytics" in s, "analytics loader insertion point missing"; p.write_text(s if "initD1Analytics" in s else s.replace(old,new))'
      - name: Validate syntax
        run: node --check assets/main.js && node --check assets/analytics.js
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/main.js
          git commit -m 'Load factory D1 analytics on all shared pages'
          git push origin HEAD:main
